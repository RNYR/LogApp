# =============================================================================
# Sklad — TEST stack (https://sklad-test.local:8444), runs beside production
#
# A second, fully separate copy of Sklad on the same NAS for reviewing a build
# before it replaces https://sklad.local. Nothing here is shared with the live
# stack:
#
#   live (docker-compose.yml)        test (this file)
#   ------------------------------   ------------------------------------
#   project   sklad                  project   sklad-test
#   services  app, caddy             services  test-app, test-caddy
#   image     sklad:local            image     sklad:test
#   ports     80/443 (or 8080/8443)  ports     8081/8444
#   volumes   sklad_sklad_data, ...  volumes   sklad_test_data, sklad_test_caddy_*
#   config    .env                   config    .env.test
#   CA        Sklad Local Authority  CA        Sklad TEST Local Authority
#
# ALWAYS drive it through the wrapper, which pins the project name and files:
#
#   cp .env.test.example .env.test     # then set SKLAD_ADMIN_PASSWORD + LAN IP
#   ./scripts/test-stack up            # build + start
#   ./scripts/test-stack down          # stop (keeps the test data)
#
# Interpolation below deliberately uses SKLAD_TEST_* names only. Compose reads
# the folder's .env (the LIVE config) for ${...} substitution when --env-file is
# not given, so reusing SKLAD_HOST / SKLAD_HTTPS_PORT here could silently pull
# in production values. The app's own settings come from .env.test.
# See docs/DEPLOY-TEST.md.
# =============================================================================
version: "3.8"

services:
  test-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${SKLAD_TEST_VERSION:-test}
        COMMIT: ${SKLAD_TEST_COMMIT:-none}
        BUILD_TIME: ${SKLAD_TEST_BUILD_TIME:-unknown}
        APP_UID: ${SKLAD_TEST_UID:-10001}
        APP_GID: ${SKLAD_TEST_GID:-10001}
    # Separate tag: building the test stack never replaces the live image.
    image: sklad:test
    container_name: sklad-test-app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    env_file:
      - .env.test
    environment:
      SKLAD_HTTP_ADDR: ":8080"
      SKLAD_DATA_DIR: /data
      SKLAD_DB_PATH: /data/sklad.db
      SKLAD_BASE_URL: "https://${SKLAD_TEST_HOST:-sklad-test.local}:${SKLAD_TEST_HTTPS_PORT:-8444}"
      SKLAD_TRUST_PROXY: "true"

    expose:
      - "8080"

    volumes:
      - sklad_test_data:/data

    networks:
      - sklad_test

    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  test-caddy:
    image: caddy:2-alpine
    container_name: sklad-test-caddy
    restart: unless-stopped
    depends_on:
      - test-app

    ports:
      - "${SKLAD_TEST_HTTP_PORT:-8081}:80"
      - "${SKLAD_TEST_HTTPS_PORT:-8444}:443"

    environment:
      SKLAD_HOST: ${SKLAD_TEST_HOST:-sklad-test.local}
      SKLAD_HOST_ALT: ${SKLAD_TEST_HOST_ALT:-sklad-test}
      SKLAD_LAN_IP: ${SKLAD_TEST_LAN_IP:-127.0.0.1}
      SKLAD_PUBLIC_PORT: ":${SKLAD_TEST_HTTPS_PORT:-8444}"
      SKLAD_APP_UPSTREAM: test-app:8080
      SKLAD_LOG_LEVEL: ${SKLAD_TEST_CADDY_LOG_LEVEL:-INFO}
      # No HSTS on the test site: browsers would otherwise remember to force
      # HTTPS for sklad-test.local for a year after the stack is gone.
      SKLAD_HSTS_MAX_AGE: "0"
      SKLAD_MAX_UPLOAD: 10MB

    volumes:
      - ./deploy/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - sklad_test_caddy_data:/data
      - sklad_test_caddy_config:/config

    extra_hosts:
      - "${SKLAD_TEST_HOST:-sklad-test.local}:127.0.0.1"

    networks:
      - sklad_test

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://${SKLAD_TEST_HOST:-sklad-test.local}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# Explicit names so the test volumes can never collide with (or be mistaken
# for) the live sklad_sklad_data / sklad_caddy_data volumes.
volumes:
  sklad_test_data:
    name: sklad_test_data
  sklad_test_caddy_data:
    name: sklad_test_caddy_data
  sklad_test_caddy_config:
    name: sklad_test_caddy_config

networks:
  sklad_test:
    name: sklad_test
    driver: bridge
